name: Deploy AskMe to GitHub Pages

on:
  # 当推送代码到 main 分支时自动触发
  push:
    branches: ["main"]
  # 支持在 GitHub Actions 页面手动点击触发按钮
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的安全权限，允许向 GitHub Pages 发布内容
permissions:
  contents: read
  pages: write
  id-token: write

# 限制并发部署：如果有新的推送，取消队列中还未开始的旧部署，但不要打断正在进行中的部署。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 阶段 1: 构建 (Build)
  build:
    runs-on: ubuntu-latest
    # 将所有的 shell 执行默认目录限定为前端文件夹
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        # 使用 npm ci (clean install) 比 npm install 更加可靠，它严格遵守 package-lock.json
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Setup Pages Configuration
        uses: actions/configure-pages@v5

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 将生成的 dist 文件夹打包为供 Pages 服务器使用的构建制品
          path: './frontend/dist'

  # 阶段 2: 部署 (Deploy)
  deploy:
    # 建立名为 github-pages 的发布环境记录，并在完成后给出一个可供访问的链接
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
