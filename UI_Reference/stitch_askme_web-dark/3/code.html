<!DOCTYPE html>

<html class="dark" lang="zh"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "error-container": "#8a1632",
              "inverse-on-surface": "#565459",
              "on-surface": "#e8e4ee",
              "secondary-container": "#292336",
              "primary-container": "#d1bcff",
              "on-secondary-container": "#a9a0b9",
              "surface-container-high": "#201f25",
              "secondary-dim": "#beb5ce",
              "on-secondary-fixed": "#443e53",
              "tertiary-fixed": "#fec5d6",
              "surface-container-lowest": "#000000",
              "on-tertiary-fixed-variant": "#704654",
              "primary-fixed": "#d1bcff",
              "primary": "#ddccff",
              "tertiary-fixed-dim": "#efb8c8",
              "outline": "#77747d",
              "on-error-container": "#ff97a3",
              "on-primary-fixed-variant": "#513f79",
              "on-secondary": "#433d52",
              "secondary-fixed": "#ece1fc",
              "on-secondary-fixed-variant": "#615a70",
              "surface-tint": "#ddccff",
              "background": "#0e0e11",
              "on-background": "#e8e4ee",
              "surface": "#0e0e11",
              "on-primary-fixed": "#332159",
              "tertiary-dim": "#efb8c8",
              "tertiary-container": "#fec5d6",
              "error-dim": "#c8475d",
              "on-tertiary": "#6f4653",
              "error": "#fd6f85",
              "inverse-primary": "#675590",
              "surface-container-low": "#141317",
              "secondary": "#ccc2dc",
              "on-surface-variant": "#ada9b3",
              "primary-fixed-dim": "#c3aef0",
              "on-tertiary-fixed": "#502b38",
              "inverse-surface": "#fdf8fd",
              "on-primary-container": "#47366f",
              "surface-container-highest": "#26252c",
              "on-error": "#490013",
              "surface-bright": "#2d2b33",
              "surface-variant": "#26252c",
              "outline-variant": "#49474f",
              "secondary-fixed-dim": "#ddd3ed",
              "on-tertiary-container": "#663d4b",
              "surface-dim": "#0e0e11",
              "surface-container": "#1a191e",
              "tertiary": "#ffd9e3",
              "primary-dim": "#c3aef0",
              "on-primary": "#503f79"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0e0e11;
            color: #e8e4ee;
            font-family: 'Inter', sans-serif;
        }
        .glass-effect {
            background: rgba(38, 37, 44, 0.8);
            backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="antialiased overflow-hidden">
<!-- SideNavBar -->
<aside class="w-[280px] h-full fixed left-0 top-0 border-none bg-[#141317] flex flex-col p-4 gap-6 font-['Manrope'] antialiased z-50">
<div class="flex items-center gap-3 px-2">
<div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary to-primary-dim flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-fixed" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<div>
<h1 class="text-xl font-bold text-[#ddccff]">AskMe AI</h1>
<p class="text-xs text-on-surface-variant">Reverse Questioning</p>
</div>
</div>
<button class="bg-[#d1bcff] text-[#47366f] rounded-full px-4 py-3 flex items-center justify-center gap-2 font-bold transition-transform scale-95 active:scale-90">
<span class="material-symbols-outlined" data-icon="add">add</span>
            New Session
        </button>
<nav class="flex flex-col gap-1 mt-2">
<a class="text-[#e8e4ee] hover:bg-[#201f25] rounded-full px-4 py-2 flex items-center gap-3 transition-colors group" href="#">
<span class="material-symbols-outlined group-hover:text-primary" data-icon="history">history</span>
                Timeline
            </a>
<a class="text-[#e8e4ee] hover:bg-[#201f25] rounded-full px-4 py-2 flex items-center gap-3 transition-colors group" href="#">
<span class="material-symbols-outlined group-hover:text-primary" data-icon="sell">sell</span>
                Tags
            </a>
<a class="text-[#e8e4ee] hover:bg-[#201f25] rounded-full px-4 py-2 flex items-center gap-3 transition-colors group" href="#">
<span class="material-symbols-outlined group-hover:text-primary" data-icon="smart_toy">smart_toy</span>
                Agents
            </a>
<a class="text-[#e8e4ee] hover:bg-[#201f25] rounded-full px-4 py-2 flex items-center gap-3 transition-colors group" href="#">
<span class="material-symbols-outlined group-hover:text-primary" data-icon="model_training">model_training</span>
                LLM
            </a>
</nav>
<div class="mt-auto flex flex-col gap-1 border-t border-outline-variant/10 pt-4">
<a class="text-[#e8e4ee] hover:bg-[#201f25] rounded-full px-4 py-2 flex items-center gap-3 transition-colors group" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
                Settings
            </a>
<a class="text-[#e8e4ee] hover:bg-[#201f25] rounded-full px-4 py-2 flex items-center gap-3 transition-colors group" href="#">
<span class="material-symbols-outlined" data-icon="help">help</span>
                Help
            </a>
<div class="flex items-center gap-3 px-4 py-4 mt-2 bg-surface-container rounded-2xl">
<div class="w-8 h-8 rounded-full bg-secondary-container overflow-hidden">
<img alt="User profile" data-alt="minimalist profile avatar of a creative professional in soft lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAatRrV64x4clWyfkmtKV8Jm9PgqGeqp-fu-gU-Ls6P388B7C91PnydMyzGRpDDJXS5NfzD4RwE86ahAdxM8rPVXq8AJFqTMKnPviEXoWQ4tQXSa4yLQK1fu781X-IF71S2gp32MMvGqx7rcG_JZoVroV-EWLgxcjg4LaxZsUlD2cMJPyD9sn-1rOyJGGime2CFSqhfE1d7YT8FTa0H776QRKMk-CEER3inxpPpLuHbtD23--7yrl2wSVdOuQOVqfdxwZfAy2kQOhLI"/>
</div>
<div class="flex-1 overflow-hidden">
<p class="text-sm font-medium truncate">Guest Curator</p>
<p class="text-[10px] text-on-surface-variant">Free Plan</p>
</div>
</div>
</div>
</aside>
<!-- Main Content Area -->
<main class="ml-[280px] w-[calc(100%-280px)] h-screen relative flex flex-col">
<!-- TopNavBar -->
<header class="h-[60px] sticky top-0 z-50 bg-[#0e0e11]/80 backdrop-blur-xl flex justify-between items-center w-full px-6 font-['Manrope'] font-medium text-sm">
<div class="flex items-center gap-4">
<span class="text-lg font-bold text-[#e8e4ee]">LaunchPad</span>
<div class="h-4 w-[1px] bg-outline-variant/30"></div>
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-sm" data-icon="cloud_done">cloud_done</span>
<span class="text-[10px] tracking-widest uppercase">Sync Ready</span>
</div>
</div>
<div class="flex items-center gap-4">
<button class="hover:text-[#ddccff] transition-colors cursor-pointer active:opacity-70 text-[#e8e4ee] flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="ios_share">ios_share</span>
                    Share
                </button>
<button class="hover:text-[#ddccff] transition-colors cursor-pointer active:opacity-70 text-[#e8e4ee] flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="download">download</span>
                    Export
                </button>
<div class="h-4 w-[1px] bg-outline-variant/30"></div>
<button class="hover:text-[#ddccff] transition-colors cursor-pointer active:opacity-70 text-[#e8e4ee]">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</header>
<!-- Central Entry Point Content -->
<div class="flex-1 flex flex-col items-center justify-center max-w-5xl mx-auto w-full px-12 pb-24">
<!-- Hero Title -->
<div class="text-center mb-16">
<h2 class="text-5xl md:text-6xl font-extrabold font-headline mb-4 bg-gradient-to-b from-on-surface to-on-surface-variant bg-clip-text text-transparent tracking-tight">
                    智识的起点
                </h2>
<p class="text-lg text-on-surface-variant font-body max-w-xl mx-auto">
                    探索、构建与进化。我是您的智识策展人，准备好开始一次深度的逆向对话了吗？
                </p>
</div>
<!-- Bento Grid Scenario Buttons -->
<div class="grid grid-cols-1 md:grid-cols-4 gap-4 w-full mb-12">
<!-- Card 1: Problem Solving -->
<button class="col-span-1 md:col-span-1 group relative overflow-hidden bg-surface-container rounded-xl p-6 text-left transition-all duration-300 hover:bg-surface-bright border border-transparent hover:border-primary/20">
<div class="mb-8 w-12 h-12 rounded-lg bg-primary-container/10 flex items-center justify-center text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-2xl" data-icon="ads_click">ads_click</span>
</div>
<h3 class="text-on-surface font-bold text-lg mb-1">理清思路</h3>
<p class="text-on-surface-variant text-sm">🎯 Problem Solving</p>
<div class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-primary text-sm" data-icon="arrow_forward">arrow_forward</span>
</div>
</button>
<!-- Card 2: Learning Exploration (Large Card) -->
<button class="col-span-1 md:col-span-2 group relative overflow-hidden bg-surface-container rounded-xl p-6 text-left transition-all duration-300 hover:bg-surface-bright border border-transparent hover:border-primary/20 flex flex-col justify-between">
<div class="flex justify-between items-start mb-12">
<div class="w-12 h-12 rounded-lg bg-tertiary-container/10 flex items-center justify-center text-tertiary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-2xl" data-icon="menu_book">menu_book</span>
</div>
<span class="px-2 py-1 rounded-full bg-surface-container-highest text-[10px] text-tertiary border border-tertiary/20">MOST POPULAR</span>
</div>
<div>
<h3 class="text-on-surface font-bold text-xl mb-1">深入学习</h3>
<p class="text-on-surface-variant text-sm">📚 Learning Exploration</p>
</div>
<div class="absolute bottom-6 right-6 opacity-0 group-hover:opacity-100 group-hover:translate-x-2 transition-all">
<span class="material-symbols-outlined text-tertiary text-2xl" data-icon="trending_flat">trending_flat</span>
</div>
</button>
<!-- Card 3: Deep Chat -->
<button class="col-span-1 md:col-span-1 group relative overflow-hidden bg-surface-container rounded-xl p-6 text-left transition-all duration-300 hover:bg-surface-bright border border-transparent hover:border-primary/20">
<div class="mb-8 w-12 h-12 rounded-lg bg-secondary-container/30 flex items-center justify-center text-secondary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-2xl" data-icon="forum">forum</span>
</div>
<h3 class="text-on-surface font-bold text-lg mb-1">深度对话</h3>
<p class="text-on-surface-variant text-sm">💭 Deep Chat</p>
<div class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-secondary text-sm" data-icon="arrow_forward">arrow_forward</span>
</div>
</button>
<!-- Card 4: Inspiration Catalyst -->
<button class="col-span-1 md:col-span-4 group relative overflow-hidden bg-surface-container rounded-xl p-5 text-left transition-all duration-300 hover:bg-surface-bright border border-transparent hover:border-primary/20 flex items-center gap-6">
<div class="w-14 h-14 rounded-full bg-gradient-to-br from-primary to-tertiary flex items-center justify-center text-on-primary-fixed group-hover:rotate-12 transition-transform">
<span class="material-symbols-outlined text-3xl" data-icon="lightbulb" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
</div>
<div class="flex-1">
<h3 class="text-on-surface font-bold text-lg">寻求启发</h3>
<p class="text-on-surface-variant text-sm">✨ Inspiration Catalyst: Generate unexpected connections and creative sparks.</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors pr-4" data-icon="keyboard_command_key">keyboard_command_key</span>
</button>
</div>
<!-- Central Input Area -->
<div class="w-full max-w-3xl relative group">
<!-- Glow Effect -->
<div class="absolute -inset-1 bg-gradient-to-r from-primary/20 to-tertiary/20 rounded-full blur-xl opacity-0 group-focus-within:opacity-100 transition-opacity duration-500"></div>
<div class="relative bg-surface-container-lowest border border-outline-variant/10 rounded-full flex items-center p-2 focus-within:border-primary/30 transition-all shadow-2xl">
<div class="pl-6 flex gap-3 text-on-surface-variant">
<button class="hover:text-primary transition-colors tooltip" title="Adaptive Persona">
<span class="material-symbols-outlined text-[20px]" data-icon="psychology">psychology</span>
</button>
<button class="hover:text-primary transition-colors" title="Session Memory">
<span class="material-symbols-outlined text-[20px]" data-icon="memory">memory</span>
</button>
</div>
<input class="flex-1 bg-transparent border-none focus:ring-0 text-on-surface px-4 py-3 placeholder:text-on-surface-variant/50 font-body" placeholder="直接输入你想探讨的问题或想法..." type="text"/>
<button class="mr-1 w-12 h-12 rounded-full bg-primary text-on-primary-fixed flex items-center justify-center hover:scale-105 active:scale-95 transition-all shadow-lg">
<span class="material-symbols-outlined font-bold" data-icon="arrow_upward">arrow_upward</span>
</button>
</div>
<!-- Input Context Bar -->
<div class="flex justify-center gap-6 mt-6">
<div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-low text-[11px] text-on-surface-variant hover:text-on-surface cursor-pointer border border-transparent hover:border-outline-variant transition-all">
<span class="material-symbols-outlined text-[14px]" data-icon="tune">tune</span>
                        Custom Settings
                    </div>
<div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-low text-[11px] text-on-surface-variant hover:text-on-surface cursor-pointer border border-transparent hover:border-outline-variant transition-all">
<span class="material-symbols-outlined text-[14px]" data-icon="history_edu">history_edu</span>
                        Recent Drafts
                    </div>
</div>
</div>
</div>
<!-- Background Ambient Element -->
<div class="fixed bottom-0 right-0 w-[600px] h-[600px] bg-primary/5 rounded-full blur-[120px] -z-10 translate-y-1/2 translate-x-1/2"></div>
<div class="fixed top-0 left-0 w-[400px] h-[400px] bg-tertiary/5 rounded-full blur-[100px] -z-10 -translate-y-1/2 -translate-x-1/2"></div>
</main>
</body></html>
